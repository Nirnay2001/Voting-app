apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deploy
spec:
  template:
    metadata:
      name: redis
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
              name: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
      