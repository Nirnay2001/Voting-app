apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-deploy
  labels:
    app: vote-deploy
spec:
  template:
    metadata:
      name: vote
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: nirnay2001/vote:forntend
          ports:
            - containerPort: 80
              name: vote

  replicas: 3
  selector:
    matchLabels:
      app: vote